name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Test
        run: mvn -B verify

      # Docs and Dockerfiles are allowed to claim Java 25 only; CI pins it.
      - name: Docs claim Java 25
        run: bash .github/scripts/check-java-version-docs.sh
